<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Quant Media | Video Retention Engineering Agency for High-Ticket Founders</title>
    <meta name="description" content="Quant Media is an elite video retention engineering agency. We help high-ticket founders, coaches, and consultants scale their organic reach with data-driven video editing, backend automation, and AI-powered lead generation." />
    <meta name="keywords" content="video retention engineering, video editing agency, YouTube growth agency, video marketing for coaches, high-ticket video content, retention-optimized video editing, organic reach growth" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Quant Media" />
    <link rel="canonical" href="https://www.quantmedia.co/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.quantmedia.co/" />
    <meta property="og:site_name" content="Quant Media" />
    <meta property="og:title" content="Quant Media | Video Retention Engineering Agency" />
    <meta property="og:description" content="We don't just edit. We engineer attention. Fix your retention rate, lower your CAC, and amplify your organic reach with data-driven video and AI automation." />
    <meta property="og:image" content="https://www.quantmedia.co/img/hero.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.quantmedia.co/" />
    <meta name="twitter:title" content="Quant Media | Video Retention Engineering Agency" />
    <meta name="twitter:description" content="We don't just edit. We engineer attention. Fix your retention rate, lower your CAC, and amplify your organic reach." />
    <meta name="twitter:image" content="https://www.quantmedia.co/img/hero.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />

    <!-- Preconnect for speed -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!-- Google Fonts with display=swap to avoid FOUT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Bootstrap grid only (no jQuery or BS JS needed — React handles all interaction) -->
    <link rel="stylesheet" href="/css/bootstrap.min.css" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Quant Media",
      "url": "https://www.quantmedia.co",
      "logo": "https://www.quantmedia.co/img/favicon.svg",
      "description": "Elite video retention engineering agency helping high-ticket founders scale their organic reach through data-driven video editing and backend automation.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "sales",
        "url": "https://cal.com/quantmedia/15min"
      },
      "sameAs": [
        "https://www.instagram.com/quantmedia.co",
        "https://youtube.com/@therealsanchitpatel"
      ],
      "serviceArea": {
        "@type": "Place",
        "name": "Worldwide"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Video Retention Engineering Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "name": "Growth Plan",
            "price": "1499",
            "priceCurrency": "USD",
            "priceSpecification": { "@type": "UnitPriceSpecification", "billingDuration": "P1M" }
          },
          {
            "@type": "Offer",
            "name": "Scale Plan",
            "price": "2499",
            "priceCurrency": "USD",
            "priceSpecification": { "@type": "UnitPriceSpecification", "billingDuration": "P1M" }
          },
          {
            "@type": "Offer",
            "name": "Partner Plan",
            "price": "4500",
            "priceCurrency": "USD",
            "priceSpecification": { "@type": "UnitPriceSpecification", "billingDuration": "P1M" }
          }
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
